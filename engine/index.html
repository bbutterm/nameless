<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/nunito/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/nunito/900.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>window.LANG = new URLSearchParams(location.search).get('lang') || null;  // before kit.js: LOCALE depends on it</script>
<script src="data/world.js"></script>
<script src="kit.js"></script>
<script>
// Loads videos/<v>/timings.js (optional, written by engine/align.py) and videos/<v>/video.js (must set window.VIDEO).
// With &lang=xx (a language variant): the original timings become TIMINGS_REF (word anchors in video.js are mapped
// onto the new narration), timings.xx.js becomes TIMINGS, and strings.xx.js (window.STRINGS) translates on-screen text.
const P = new URLSearchParams(location.search);
const v = P.get('v') || 'basilisk', lang = P.get('lang');
window.LANG = lang || null;
const load = (src, optional) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = optional ? res : rej; document.head.appendChild(s); });
window.READY = (async () => {
  await load(`../videos/${v}/timings.js`, true);
  if (lang) {
    window.TIMINGS_REF = window.TIMINGS; window.TIMINGS = undefined;
    await load(`../videos/${v}/timings.${lang}.js`);
    await load(`../videos/${v}/strings.${lang}.js`, true);
  }
  const fams = ['800 40px Unbounded', '900 40px Unbounded', '700 40px Unbounded', '700 40px Montserrat', '800 40px Montserrat', '500 40px Montserrat', '800 40px Nunito', '900 40px Nunito', '700 40px Nunito'];
  for (const f of fams) await document.fonts.load(f, 'АБВабвABC2010∞');
  await load(`../videos/${v}/video.js`);
  window.renderAt = makeRenderer(document.getElementById('c'), VIDEO.drawScene, VIDEO.drawOverlay, VIDEO.mbFn);
  return VIDEO.END;
})();
</script></body></html>
